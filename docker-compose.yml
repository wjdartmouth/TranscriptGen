services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transcriptgen
      POSTGRES_USER: transcriptgen
      POSTGRES_PASSWORD: local-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcriptgen"]
      interval: 5s
      retries: 10
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://transcriptgen:local-dev-only@db:5432/transcriptgen
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./apps/web
    ports: ["5173:5173"]
    depends_on: [api]
